<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MotoMarket Pro - Contacto</title>
    <link rel="stylesheet" href="../css/estilos_base.css">
    <link rel="stylesheet" href="../css/estilos_contacto.css">
</head>
<body>

    <header>
        <h1>MotoMarket Pro</h1>
        <nav>
            <a href="index.html">Inicio</a>
            <a href="catalogo.html">Catálogo</a>
            <a href="contacto.html">Contacto</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Cotiza tu Motocicleta</h2>
            <p>Déjanos tus datos y un asesor comercial se pondrá en contacto contigo de inmediato.</p>

            <section class="seccion-formulario">
                <form>
                    <section class="grupo-formulario">
                        <label for="nombre">Nombre Completo:</label>
                        <input type="text" id="nombre" placeholder="Ej. Carlos Pérez" required>
                    </section>

                    <section class="grupo-formulario">
                        <label for="email">Correo Electrónico:</label>
                        <input type="email" id="email" placeholder="correo@ejemplo.com" required>
                    </section>

                    <section class="grupo-formulario">
                        <label for="telefono">Número de Teléfono:</label>
                        <input type="tel" id="telefono" placeholder="3001234567" required>
                    </section>

                    <section class="grupo-formulario">
                        <label for="moto-interes">Moto de Interés:</label>
                        <select id="moto-interes">
                            <option value="ns200">Bajaj Pulsar NS 200</option>
                            <option value="scooter">Scooter CityEco 150</option>
                            <option value="enduro">AKT TTR 200 Enduro</option>
                            <option value="mt03">Yamaha MT-03</option>
                            <option value="vstrom">Suzuki V-Strom 250</option>
                            <option value="hunter">Royal Enfield Hunter 350</option>
                            <option value="apacher">TVS Apache RTR 160</option>
                            <option value="Hunk">Hero Hunk 125R</option>
                            <option value="Duke">KTM Duke 200</option>
                            <option value="n160">Bajaj Pulsar N160</option>
                            <option value="CFMoto">CFMoto 250SR</option>
                            <option value="Suzuki">Suzuki DR160X</option>
                        </select>
                    </section>

                    <section class="grupo-formulario">
                        <label for="mensaje">Mensaje o Comentarios:</label>
                        <textarea id="mensaje" rows="4" placeholder="¿Tienes alguna duda sobre financiación o pagos?"></textarea>
                    </section>

                    <section class="contenedor-boton">
                        <button type="submit" class="boton-principal boton-enviar" >Enviar Cotización</button>
                    </section>
                </form>
            </section>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 MotoMarket Pro. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
